name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - assets/**
      - packaging/**
      - .github/workflows/package.yml

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Cache cargo-bundle
        id: cargo-bundle-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cargo-bundle/bin
          key: cargo-bundle-0.12.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-bundle on the runner
        if: steps.cargo-bundle-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-bundle --version 0.12.0 --locked --root "$RUNNER_TEMP/cargo-bundle"
      - name: Add cargo-bundle to PATH
        run: echo "$RUNNER_TEMP/cargo-bundle/bin" >> "$GITHUB_PATH"
      - name: Build universal DMG
        run: cargo bundle --release --format dmg --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Stage package and installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          dmg_path=$(find target/universal/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg_path"
          cp "$dmg_path" dist/dark-horse-macos-universal.dmg
          dmg_sha=$(shasum -a 256 dist/dark-horse-macos-universal.dmg | awk '{print $1}')
          printf '%s  %s\n' "$dmg_sha" dark-horse-macos-universal.dmg > dist/SHA256SUMS
          cat > dist/dark-horse.rb <<EOF
          cask "dark-horse" do
            version "$version"
            sha256 "$dmg_sha"

            url "https://github.com/acadega88/dark-horse/releases/download/v#{version}/dark-horse-macos-universal.dmg"
            name "Dark Horse Browser"
            desc "A privacy-focused desktop web browser"
            homepage "https://github.com/acadega88/dark-horse"

            app "Dark Horse Browser.app"
          end
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dark-horse-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows WinGet installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install Inno Setup on the runner
        run: choco install innosetup --yes --no-progress
      - name: Build the release executable and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $outputDirectory = Join-Path $PWD.Path 'target\installer'
          New-Item -ItemType Directory -Force $outputDirectory | Out-Null
          & $iscc "/O$outputDirectory" "/DAppVersion=$version" 'packaging\windows\dark-horse.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          New-Item -ItemType Directory -Force dist | Out-Null
          $installer = Get-ChildItem target/installer -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Inno Setup did not produce an installer.' }
          Copy-Item $installer.FullName dist/dark-horse-windows-x64-setup.exe
          $installerHash = (Get-FileHash dist/dark-horse-windows-x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  dark-horse-windows-x64-setup.exe" | Set-Content dist/dark-horse-windows-x64-setup.exe.sha256
          $manifestDirectory = "dist/winget/$version"
          New-Item -ItemType Directory -Force $manifestDirectory | Out-Null
          $releaseUrl = "https://github.com/acadega88/dark-horse/releases/download/v$version/dark-horse-windows-x64-setup.exe"
          $installerManifest = @"
          PackageIdentifier: Acadega88.DarkHorse
          PackageVersion: $version
          Installers:
            - Architecture: x64
              InstallerType: inno
              InstallerUrl: $releaseUrl
              InstallerSha256: $installerHash
              Scope: user
              InstallerSwitches:
                Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
                SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART /SP-
          ManifestType: installer
          ManifestVersion: 1.6.0
          "@
          Set-Content "$manifestDirectory/$version.installer.yaml" $installerManifest
          $versionManifest = @"
          PackageIdentifier: Acadega88.DarkHorse
          PackageVersion: $version
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          "@
          Set-Content "$manifestDirectory/$version.yaml" $versionManifest
          $localeManifest = @"
          PackageIdentifier: Acadega88.DarkHorse
          PackageVersion: $version
          PackageLocale: en-US
          Publisher: Dark Horse Project
          PackageName: Dark Horse Browser
          License: Unknown
          ShortDescription: A privacy-focused desktop web browser
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          "@
          Set-Content "$manifestDirectory/$version.locale.en-US.yaml" $localeManifest
      - uses: actions/upload-artifact@v4
        with:
          name: dark-horse-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Debian/Ubuntu .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install WebKitGTK build dependencies
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o APT::Update::Error-Mode=any \
            update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Cache cargo-bundle
        id: cargo-bundle-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cargo-bundle/bin
          key: cargo-bundle-0.12.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-bundle on the runner
        if: steps.cargo-bundle-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-bundle --version 0.12.0 --locked --root "$RUNNER_TEMP/cargo-bundle"
      - name: Add cargo-bundle to PATH
        run: echo "$RUNNER_TEMP/cargo-bundle/bin" >> "$GITHUB_PATH"
      - name: Build Debian package
        run: |
          cargo bundle --release --format deb
          mkdir -p dist
          deb=$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$deb"
          cp "$deb" dist/dark-horse-linux-amd64.deb
          sha256sum dist/dark-horse-linux-amd64.deb > dist/dark-horse-linux-amd64.deb.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dark-horse-linux-deb-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged package artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
