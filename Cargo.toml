[package]
name = "dark-horse"
version = "0.1.0"
edition = "2024"
authors = ["Dark Horse Project"]
description = "A privacy-focused desktop web browser"

[package.metadata.bundle]
name = "Dark Horse Browser"
identifier = "com.acadega88.darkhorse"
icon = ["assets/dark-horse-icon.png", "assets/dark-horse-icon.ico"]
resources = ["assets/dark-horse-icon.ico"]
category = "Entertainment"
short_description = "A privacy-focused desktop web browser"
deb_depends = ["libgtk-3-0", "libwebkit2gtk-4.1-0", "libxdo3"]

[dependencies]
directories = "6.0"
eframe = "0.36.2"
muda = "0.20.0"
raw-window-handle = "0.6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wry = "0.57.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = "0.6.2"
objc2 = { version = "0.6.4", features = ["std"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3.2", features = ["WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2"] }
adblock = { version = "0.13.5", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "full-regex-handling", "single-thread"] }
