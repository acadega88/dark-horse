app-id: com.acadega88.darkhorse
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: dark-horse
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --device=dri
  - --env=GDK_BACKEND=x11
modules:
  - name: dark-horse
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/dark-horse/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --locked --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --locked --bin dark-horse
      - install -Dm0755 target/release/dark-horse ${FLATPAK_DEST}/bin/dark-horse
      - install -Dm0644 packaging/flatpak/com.acadega88.darkhorse.desktop ${FLATPAK_DEST}/share/applications/com.acadega88.darkhorse.desktop
      - install -Dm0644 assets/dark-horse-icon.png ${FLATPAK_DEST}/share/icons/hicolor/1024x1024/apps/com.acadega88.darkhorse.png
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - .flatpak-builder
          - packaging/flatpak/cargo-sources.json
      - cargo-sources.json
